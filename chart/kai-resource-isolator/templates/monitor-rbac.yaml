{{- if .Values.monitor.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kai-resource-isolator.monitor.fullname" . }}
  namespace: {{ include "kai-resource-isolator.namespace" . }}
  labels:
    app.kubernetes.io/component: kai-vgpu-monitor
    {{- include "kai-resource-isolator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kai-resource-isolator.monitor.fullname" . }}
  labels:
    app.kubernetes.io/component: kai-vgpu-monitor
    {{- include "kai-resource-isolator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kai-resource-isolator.monitor.fullname" . }}
  labels:
    app.kubernetes.io/component: kai-vgpu-monitor
    {{- include "kai-resource-isolator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kai-resource-isolator.monitor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kai-resource-isolator.monitor.fullname" . }}
    namespace: {{ include "kai-resource-isolator.namespace" . }}
{{- end }}
