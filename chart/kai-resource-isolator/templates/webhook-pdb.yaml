{{- $pdb := .Values.webhook.podDisruptionBudget | default dict }}
{{- if not (kindIs "map" $pdb) }}
{{- $pdb = dict }}
{{- end }}
{{- $maxUnavailable := get $pdb "maxUnavailable" }}
{{- $minAvailable := get $pdb "minAvailable" }}
{{- $intOrPercent := "^[0-9]+%?$" }}
{{- $hasMaxUnavailable := and (hasKey $pdb "maxUnavailable") (not (kindIs "invalid" $maxUnavailable)) (regexMatch $intOrPercent (toString $maxUnavailable)) }}
{{- $hasMinAvailable := and (hasKey $pdb "minAvailable") (not (kindIs "invalid" $minAvailable)) (regexMatch $intOrPercent (toString $minAvailable)) }}
{{- if gt (int .Values.webhook.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kai-resource-isolator.webhook.fullname" . }}
  namespace: {{ include "kai-resource-isolator.namespace" . }}
  labels:
    app.kubernetes.io/component: kai-webhook
    {{- include "kai-resource-isolator.labels" . | nindent 4 }}
spec:
  {{- if $hasMaxUnavailable }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else if $hasMinAvailable }}
  minAvailable: {{ $minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: kai-webhook
      {{- include "kai-resource-isolator.selectorLabels" . | nindent 6 }}
{{- end }}
