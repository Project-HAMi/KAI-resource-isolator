{{- if and .Values.rbac.create .Values.tls.patch.enabled (not .Values.tls.certManager.enabled) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kai-resource-isolator.fullname" . }}-admission
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "kai-resource-isolator.labels" . | nindent 4 }}
rules:
  ## Cluster-scoped: patch Job injects CA into this MutatingWebhookConfiguration only.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
    verbs:
      - get
      - update
    resourceNames:
      - {{ include "kai-resource-isolator.webhook.configName" . }}
{{- end }}
