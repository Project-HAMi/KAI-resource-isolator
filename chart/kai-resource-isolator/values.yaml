## Default values mirror HAMi device-plugin hook layout (HOOK_PATH=/usr/local → /usr/local/vgpu on host).
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

global:
  ## Overrides image-specific registries for all chart-managed images when set.
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: docker.io
  repository: projecthami/kai-resource-isolator
  tag: latest
  pullPolicy: IfNotPresent

paths:
  ## Host directory base; the chart installs libraries under {hostInstallBase}/vgpu/
  hostInstallBase: /usr/local
  ## Path inside the container and on the host (same absolute path is required for ld.so.preload and device-plugin compatibility)
  containerVgpuMount: /usr/local/vgpu

librarySync:
  ## Node labels for GPU nodes (empty = all nodes)
  nodeSelector: {}
  tolerations:
    - operator: Exists
      effect: NoSchedule
  resources: {}
  priorityClassName: system-node-critical
  podLabels: {}
  podAnnotations: {}

## kai-vgpu-monitor: per-container VRAM metrics (hami_* names) on :9394
monitor:
  ## Opt-in: the monitor runs a privileged DaemonSet that mmaps libvgpu caches and
  ## needs NVML, so it belongs on GPU nodes only. Review nodeSelector before enabling.
  enabled: false
  ## Node labels that select GPU nodes. Default matches NVIDIA GPU feature discovery;
  ## set to {} only if every node in the cluster has NVIDIA GPUs.
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - operator: Exists
      effect: NoSchedule
  ## Set when NVML needs the NVIDIA container runtime handler (e.g. "nvidia")
  runtimeClassName: ""
  resources: {}
  priorityClassName: system-node-critical
  podLabels: {}
  podAnnotations: {}
  resyncInterval: 5m
  updateInterval: 5s
  metricsPort: 9394
  service:
    type: ClusterIP
    port: 9394
    annotations: {}
    labels: {}
  ## Optional Prometheus Operator ServiceMonitor
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  ## Emit legacy HAMi metric names alongside hami_*
  legacyMetrics: false

webhook:
  ## Production installs should run at least 2 replicas together with
  ## webhook.podDisruptionBudget. With the default minAvailable: 1 a voluntary
  ## disruption such as a node drain or an eviction cannot take the last
  ## webhook pod away; a custom maxUnavailable can, and Kubernetes rounds a
  ## percentage up, so keep minAvailable unless losing a pod is intended. With
  ## a single replica the PodDisruptionBudget would block all voluntary node
  ## drains, so the PodDisruptionBudget and the pod anti-affinity only render
  ## when replicaCount > 1. Chart upgrades are not what the extra replica and
  ## the PodDisruptionBudget are for: the default RollingUpdate strategy
  ## (maxUnavailable 0, maxSurge 1) starts the replacement pod before the old
  ## one is removed, at any replicaCount, as long as the new pod becomes
  ## ready.
  replicaCount: 1
  ## Precedence when replicaCount > 1: maxUnavailable, then minAvailable, then
  ## the chart default of 1. An availability value is only used when it is a
  ## non-negative integer, or a percentage from 0 to 100, so an unset, null,
  ## empty, negative, out of range or otherwise unusable podDisruptionBudget
  ## falls back to minAvailable: 1 instead of failing to render or producing an
  ## object the API server rejects. Numeric 0 is valid.
  podDisruptionBudget:
    minAvailable: 1
    # maxUnavailable: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  ## Comma-separated extended resources that trigger injection (HAMi vGPU sharing)
  gpuShareResources: "nvidia.com/gpu,nvidia.com/gpumem,nvidia.com/gpucores"
  failurePolicy: Ignore

tls:
  ## When cert-manager is enabled, set patch.enabled to false.
  ## Creates a namespaced self-signed Issuer + Certificate.
  certManager:
    enabled: false
  patch:
    enabled: true
    image:
      registry: docker.io
      repository: jettech/kube-webhook-certgen
      tag: v1.5.2
      pullPolicy: IfNotPresent
    imageNew:
      registry: docker.io
      repository: liangjw/kube-webhook-certgen
      tag: v1.1.1
      pullPolicy: IfNotPresent
    runAsUser: 2000
    nodeSelector: {}
    tolerations: []

service:
  type: ClusterIP
  port: 443

## RBAC for kube-webhook-certgen Helm hook Jobs only (not the webhook Deployment).
## When true (default), creates namespaced Role for secrets + ClusterRole for MutatingWebhookConfiguration.
rbac:
  create: true
