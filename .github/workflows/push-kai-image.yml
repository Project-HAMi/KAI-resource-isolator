name: Build and Push Kai Image

on:
  push:
    branches:
      - main

concurrency:
  group: kai-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Build and push webhook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.webhook
          push: true
          tags: docker.io/projecthami/kai-resource-isolator-webhook:latest

      - name: Build and push libsync image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.libsync
          push: true
          tags: docker.io/projecthami/kai-resource-isolator-libsync:latest
