name: Build and Push Kai Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

concurrency:
  group: kai-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "webhook=docker.io/projecthami/kai-resource-isolator-webhook:${VERSION}"$'\n'"docker.io/projecthami/kai-resource-isolator-webhook:latest" >> "$GITHUB_OUTPUT"
            echo "libsync=docker.io/projecthami/kai-resource-isolator-libsync:${VERSION}"$'\n'"docker.io/projecthami/kai-resource-isolator-libsync:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "webhook=docker.io/projecthami/kai-resource-isolator-webhook:ci-latest" >> "$GITHUB_OUTPUT"
            echo "libsync=docker.io/projecthami/kai-resource-isolator-libsync:ci-latest" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Build webhook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.webhook
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.webhook }}

      - name: Build libsync image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.libsync
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.libsync }}
